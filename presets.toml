# SID patches, selected with MIDI program change (program N -> preset N % count).
# Keys left out keep their current value. Allowed keys:
#   name, waveform, pulse_width (0-4095), attack/decay/sustain/release (0-15),
#   filter_mode (off|lp|bp|hp|lp+hp|lp+bp|bp+hp|lp+bp+hp), filter_voices (bool),
#   cutoff (0-2047), resonance (0-15), volume (0-15)
# waveform: tri | saw | pulse | noise | tri+saw | tri+pulse | saw+pulse | tri+saw+pulse

